# Local profile — points at the same Postgres the ingestion scripts use.
# Run dbt from the dbt/ directory (or pass --profiles-dir dbt) so it's
# picked up without touching ~/.dbt/profiles.yml.
brisbane_transit:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'transit') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'transit') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'brisbane_transit') }}"
      schema: analytics
      threads: 4
