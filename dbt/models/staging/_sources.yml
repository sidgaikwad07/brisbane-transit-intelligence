version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: routes
      - name: trips
      - name: stops
      - name: stop_times
      - name: calendar
      - name: calendar_dates
      - name: trip_updates
        description: Append-only GTFS-RT Trip Update polls — one row per (poll, trip, stop_time_update).
      - name: vehicle_positions
        description: Append-only GTFS-RT Vehicle Position polls — one row per (poll, vehicle).
      - name: service_alerts
        description: Append-only GTFS-RT Service Alert polls, flattened one row per (poll, alert, informed entity).
      - name: od_trips
        description: >
          Queensland Government monthly aggregated go card/EMV/paper-ticket origin-destination
          trip counts (already aggregated by TransLink, not individual taps).
          https://www.data.qld.gov.au/dataset/translink-origin-destination-trips-2022-onwards
